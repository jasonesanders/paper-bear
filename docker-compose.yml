version: '3.8'

services:
  paper-bear-scraper:
    build:
      context: .
      args:
        - ASTRO_DB_REMOTE_URL=${ASTRO_DB_REMOTE_URL}
        - ASTRO_DB_APP_TOKEN=${ASTRO_DB_APP_TOKEN}
    container_name: paper-bear-scraper
    ports:
      - "4321:4321"
    env_file:
      - .env
    environment:
      # Static config (non-secret, safe to hardcode)
      - SCRAPER_USER_AGENT=PaperBear/1.0 (Vancouver Community Events Bot; contact@paperbear.dev)
      - SCRAPER_DELAY_MS=1500
      - NODE_ENV=production
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
